# GeoNexo completo. Para subir:  docker compose up -d --build
# Nada é obrigatório no .env; veja .env.docker.example.
name: geonexo

services:
  # API, painel público, painel administrativo e aplicativo web (PWA).
  app:
    image: geonexo-server
    build:
      context: .
      target: server
    restart: unless-stopped
    init: true
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_COOKIE_SECRET: ${ADMIN_COOKIE_SECRET:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      APP_AUTH_TOKEN: ${APP_AUTH_TOKEN:-}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-}
      ENABLE_APP_AUTH: "true"
      ALLOW_LEGACY_MESSAGE_POST_WITHOUT_AUTH: ${ALLOW_LEGACY_MESSAGE_POST_WITHOUT_AUTH:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-}
      OVERPASS_BASE_URL: ${OVERPASS_BASE_URL:-}
    volumes:
      - data:/data
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # Processa as respostas recebidas e faz a manutenção diária (no lugar do cron).
  jobs:
    image: geonexo-server
    pull_policy: never
    restart: unless-stopped
    init: true
    command: ["node", "/srv/docker/start.js", "/srv/docker/jobs.js"]
    environment:
      JOBS_BASE_URL: http://app:3001
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-}
    healthcheck:
      disable: true
    volumes:
      - data:/data
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

  # Porta de entrada. Com um domínio em SITE_ADDRESS, o HTTPS é automático.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

  # Opcional: gera o APK em dist/.  docker compose run --rm --build apk
  apk:
    profiles: [apk]
    build:
      context: .
      target: apk
    environment:
      API_BASE_URL: ${API_BASE_URL:-}
      APP_AUTH_TOKEN: ${APP_AUTH_TOKEN:-}
    volumes:
      - data:/data:ro
      - android-keys:/root/.android
      - gradle-cache:/root/.gradle
      - ./dist:/out

volumes:
  data:
  caddy-data:
  caddy-config:
  android-keys:
  gradle-cache:
