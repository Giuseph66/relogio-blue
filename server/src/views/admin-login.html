<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar · GeoNexo Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>

<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      </span>
      <div>
        <strong>GeoNexo</strong>
        <span>Painel administrativo</span>
      </div>
    </div>

    <h1>Entrar</h1>
    <p class="login-sub">Gerencie locais monitorados e as perguntas enviadas ao relógio.</p>

    <form id="login-form" class="login-form" novalidate>
      <label class="field">
        <span class="field-label">E-mail</span>
        <input id="email" type="email" autocomplete="username" placeholder="admin@empresa.com" required autofocus />
      </label>
      <label class="field">
        <span class="field-label">Senha</span>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
      </label>
      <p id="login-feedback" class="form-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Entrar</button>
    </form>
  </main>
  <script src="/admin/login.js" defer></script>
</body>

</html>
